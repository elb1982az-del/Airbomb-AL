name: android

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine:
    name: engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests (fully mocked radios)
        run: cd backend && python -m unittest -v test_engine

  apk:
    name: release apk
    runs-on: ubuntu-latest
    needs: engine
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "Using SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -3
          ls "$ANDROID_HOME/build-tools" | tail -3

      - name: Decode signing key (optional)
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/airbomb-release.jks
          {
            echo "storeFile=airbomb-release.jks"
            echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } > android/keystore.properties

      - name: Build release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Airbomb-Al.apk
          sha256sum dist/Airbomb-Al.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Airbomb-Al.apk
          path: dist/Airbomb-Al.apk
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Airbomb-Al.apk
          generate_release_notes: true
